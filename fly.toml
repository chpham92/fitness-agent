# fly.toml app configuration file generated for fitness-coaching-agent on 2026-08-27T20:18:53-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fitness-coaching-agent'
primary_region = 'iad'

[build]
[env]
  FITNESS_AGENT_MODEL = 'claude-opus-5'

[[mounts]]
  source = 'fitness_agent_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
