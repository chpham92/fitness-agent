# Template only — copy to secret.yaml, fill in the real key, and never commit
# secret.yaml (it's covered by k8s/.gitignore below). Prefer the imperative
# command instead of a checked-out file at all:
#
#   kubectl create secret generic fitness-agent-secrets \
#     --namespace fitness-agent \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --dry-run=client -o yaml | kubectl apply -f -
#
apiVersion: v1
kind: Secret
metadata:
  name: fitness-agent-secrets
  namespace: fitness-agent
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "replace-me"
