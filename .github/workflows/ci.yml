name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Live-API integration tests in this suite need ANTHROPIC_API_KEY; they're
      # skipped automatically when it's unset (see tests/), so this runs the
      # deterministic majority of the suite without needing a repo secret.
      - run: pytest -v
